<body>
<section id="login">
  <div class="lh"><span>مسك | شات عربي للجوال</span><button id="rf" aria-label="تحديث">&#8635;</button></div>
  <div class="bn"><div><h1>مسك</h1><p>دردشة عربية مجانية، بدون تحميل</p></div></div>
  <div class="tk">أهلاً بكم في مسك، ادخل باسم مستعار وابدأ الكلام.</div>
  <div class="pills">
    <button class="gold" data-i="الاشتراكات قيد الإعداد">الاشتراكات</button>
    <button data-i="rules">القوانين</button>
    <button data-i="الأسئلة الشائعة قيد الإعداد">الأسئلة</button>
    <button class="pink" data-i="صفحة التواصل قيد الإعداد">اتصل بنا</button>
  </div>
  <div class="two"><button>الشات الكتابي</button><button disabled>الشات الصوتي (قريبًا)</button></div>
  <div class="tabs3"><button data-m="g" class="on">دخول الزوار</button><button data-m="m">دخول الأعضاء</button><button data-m="r">تسجيل عضوية</button></div>
  <form id="lf">
    <div class="ins"><input id="ln" maxlength="20" placeholder="الاسم المستعار" autocomplete="off"><input id="lp" type="password" placeholder="كلمة المرور" hidden></div>
    <button>دخول</button>
  </form>
  <div id="lerr" role="alert"></div>
  <div class="st"><b id="cn">0</b><b id="stt" class="off">يتم الاتصال</b></div>
  <div id="ul"></div>
  <div class="ft">&copy; مسك. جميع الحقوق محفوظة.</div>
</section>

<div id="app">
  <div class="top"><button id="snd" aria-label="الصوت">&#128266;</button><div class="strip" id="strip"></div></div>
  <div id="log" aria-live="polite"></div>
  <div id="ep" hidden></div>
  <form id="f"><button type="button" id="out2" aria-label="مغادرة الغرفة" title="مغادرة الغرفة">&#10162;</button><button type="button" id="emo" aria-label="إيموجي">&#128578;</button><button type="button" id="att" aria-label="إرفاق ملف">&#128206;</button><input id="t" maxlength="300" placeholder="اكتب رسالتك هنا" autocomplete="off"><button class="send">إرسال</button></form>
  <nav id="nav"><button data-p="users"><b id="nu">0</b> المتواجدين</button><button data-p="chats">خاص</button><button data-p="rooms">الغرف</button><button data-p="wall">الحائط</button><button data-p="settings">الضبط</button></nav>
  <aside id="panel" hidden><div class="ph"><b id="pt"></b><button id="pc" aria-label="إغلاق">&#10006;</button></div><div id="pb"></div></aside>
  <div id="pf" hidden><div id="pfc"></div></div>
  <div id="wl"></div>
  <div id="toast" role="status"></div>
  <div id="nt"><div class="ntc"><b id="ntt"></b><p id="ntb"></p><button id="nto">حسنًا</button></div></div>
  <div id="pw" hidden><div class="pwh"><b id="pwn"></b><button id="pwx" aria-label="إغلاق">&#10006;</button></div><div id="pwl"></div><form id="pwf"><button type="button" id="pwa" aria-label="إرفاق ملف">&#128206;</button><input id="pwt" maxlength="300" placeholder="اكتب رسالة خاصة" autocomplete="off"><button>إرسال</button></form></div>
</div>

<script>
const $ = s => document.querySelector(s);
let rN = 0, pendW = null, curRW = '', ws, me, room = '', pmw = null, tab = '', nopm = false, sound = true;
let rooms = [], users = [], msgs = [];
let ONLINE = new Set(), BOT = null, MEM = null, CFG = {}, STATS = null, WALL = null, COMM = {}, openPost = null, wdraft = '', wimg = null, wallDot = false, RESTART = false, toastT, unreadN = 0;
const NSD = { msg: true, mention: true, pm: true, desk: false, mutesound: false, wallOff: false };
const NS = (() => { try { return { ...NSD, ...JSON.parse(localStorage.getItem('ns') || '{}') }; } catch { return { ...NSD }; } })();
let extv = '', XP = 'day', RANK = {}, NOTIFS = null, UNREAD = 0, GAL = null;
const saveNS = () => { try { localStorage.setItem('ns', JSON.stringify(NS)); } catch {} };
const U = u => (window.__files && window.__files[u]) || u; // مسار الملف (النسخة التجريبية بتحوله لملف محلي)
const pms = {}, names = {}, unread = {}, blocked = new Set(), pmeta = {}, inb = {};
let IGN = [], REPS = null, REPN = 0, FAKES = null, fkEdit = null;
const pkey = (sid, uid) => uid ? 'u' + uid : 's' + sid;
const pmSetMeta = (k, sid, uid, name) => { pmeta[k] = { sid: sid ?? (pmeta[k] && pmeta[k].sid) ?? null, uid: uid || null }; if (name) names[k] = name; };
const pmOnline = k => { const x = pmeta[k] || {}; return x.uid ? users.some(u => u.uid === x.uid) || ONLINE.has(x.sid) : ONLINE.has(x.sid); };
const hue = id => `hsl(${(id * 47) % 360} 55% 32%)`;
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const sys = text => { msgs.push({ sys: 1, text }); draw(); };

let mode = 'g';
let RULES = '', SITE = {}, ROLES = null, LOGS = {}, cpv = '';
const did = () => { try { let d = localStorage.getItem('did'); if (!d) { d = crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2); localStorage.setItem('did', d); } return d; } catch { return 'nostore-' + Math.random().toString(36).slice(2); } };
const tok = () => { try { return localStorage.getItem('tk') || ''; } catch { return ''; } };
const saveTok = t => { try { t ? localStorage.setItem('tk', t) : localStorage.removeItem('tk'); } catch {} };
const can = p => me.perms.includes(p);
function conn() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/?d=' + encodeURIComponent(did()));
  ws.onopen = () => { $('#stt').textContent = 'متصل'; $('#stt').className = ''; if (tok()) send({ t: 'resume', token: tok() }); };
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => {
    $('#stt').textContent = 'غير متصل'; $('#stt').className = 'off';
    if (me && RESTART) { const t = setInterval(() => fetch('/').then(r => r.ok && (clearInterval(t), location.reload())).catch(() => {}), 2000); } else if (me) popup('انقطع الاتصال', 'انقطع الاتصال بالسيرفر. حدّث الصفحة للدخول من جديد.'); else setTimeout(conn, 3000);
  };
}
conn();
$('#rf').onclick = () => location.reload();
document.querySelectorAll('.pills button').forEach(b => b.onclick = () => $('#lerr').textContent = b.dataset.i === 'rules' ? RULES : b.dataset.i);
document.querySelectorAll('.tabs3 button').forEach(b => b.onclick = () => {
  mode = b.dataset.m; $('#lerr').textContent = '';
  document.querySelectorAll('.tabs3 button').forEach(x => x.classList.toggle('on', x === b));
  $('#lp').hidden = mode === 'g';
});
$('#lf').onsubmit = e => {
  e.preventDefault();
  const name = $('#ln').value.trim(), pass = $('#lp').value; if (!name) return;
  if (ws.readyState !== 1) return $('#lerr').textContent = 'غير متصل بالسيرفر';
  $('#lerr').textContent = '';
  send(mode === 'g' ? { t: 'login', name } : { t: mode === 'm' ? 'login' : 'register', name, pass });
};


function handle(m) {
  if (m.t === 'online') { ONLINE = new Set(m.ids || []); if (pmw !== null && me) drawPm(); return lobby(m); }
  if (m.t === 'notice') return popup(m.title, m.text);
  if (m.t === 'whois') return showProfile(m);
  if (m.t === 'reveal') return showReveal(m);
  if (m.t === 'logs') { LOGS[m.kind] = m.rows; if (tab === 'cp') side(); return; }
  if (m.t === 'alert') { popup('تنبيه من ' + (m.dn || m.fromName), m.text || 'بعتلك تنبيه.'); beep(); return; }
  if (m.t === 'roles') { ROLES = m; if (tab === 'cp') side(); return; }
  if (m.t === 'cfg') { CFG = m; if (tab === 'cp') side(); return; }
  if (m.t === 'members') { MEM = m; if (tab === 'cp') side(); return; }
  if (m.t === 'vipin') { vipFx(m.dn || m.name); return; }
  if (m.t === 'botcfg') { BOT = m; if (tab === 'cp') side(); return; }
  if (m.t === 'stats') { STATS = m; if (tab === 'cp') side(); return; }
  if (m.t === 'wall') { WALL = m; wimg = wimg && m.list.some(p => p.img === wimg.url) ? null : wimg; if (tab === 'wall') side(); return; }
  if (m.t === 'comments') { COMM[m.id] = m; if (tab === 'wall') side(); return; }
  if (m.t === 'wallnew') { if (tab === 'wall') send({ t: 'wall' }); else if (!NS.wallOff) { wallDot = true; side(); } return; }
  if (m.t === 'notif') {
    if (m.n.kind === 'wall' && NS.wallOff) return;
    UNREAD = m.unread; if (NOTIFS) NOTIFS.unshift(m.n);
    if (m.n.kind !== 'mention') { toast(m.n.text); if (!NS.mutesound) beep(740); }
    return side();
  }
  if (m.t === 'notifs') { NOTIFS = m.list; UNREAD = 0; if (tab === 'ext') side(); return side(); }
  if (m.t === 'rank') { RANK[m.kind + ':' + m.period] = m; if (tab === 'ext') side(); return; }
  if (m.t === 'gallery') { GAL = m; if (tab === 'ext') side(); return; }
  if (m.t === 'looks') { me.fr = m.frame; me.bgi = m.bg; if (GAL) { GAL.frame = m.frame; GAL.bg = m.bg; } if (tab === 'ext') side(); return; }
  if (m.t === 'avatar') { me.av = m.url; return; }
  if (m.t === 'restarting') { RESTART = true; return popup('إعادة تشغيل الموقع', 'الموقع بيعيد التشغيل دلوقتي، الصفحة هتتحدث لوحدها.'); }
  if (m.t === 'token') return saveTok(m.token);
  if (m.t === 'badtoken') return saveTok('');
  if (m.t === 'site') return applySite(m);
  if (m.t === 'perms') { me.role = m.role; me.perms = m.perms; return side(); }
  if (m.t === 'history') { const L = m.list.map(x => x.sys ? (x.name ? { sys: 1, ev: (x.file && x.file.ev) || 'leave', room: x.file && x.file.room, name: x.name, dn: x.dn, av: x.av, fr: x.fr, text: x.text, ts: x.ts } : { sys: 1, text: x.text }) : x); if (pendW && !m.replace) { msgs = msgs.concat(L, pendW); pendW = null; } else msgs = m.replace ? L : L.concat(msgs); draw(); return; }
  if (m.t === 'err') return me ? popup('تنبيه', m.text) : ($('#lerr').textContent = m.text);
  if (m.t === 'welcome') { me = m; UNREAD = m.unread || 0; if (m.token) saveTok(m.token); $('#login').style.display = 'none'; $('#app').style.display = 'flex'; }
  else if (m.t === 'joined') { room = m.room; curRW = m.rw || ''; const w = m.rw ? [{ sys: 1, roomw: 1, room: m.room, text: m.rw }] : [{ sys: 1, welcome: 1, text: 'أهلاً بيك يا ' + me.name + ' في غرفة "' + m.room + '"' }]; if (msgs.length) { msgs = msgs.slice(-200); pendW = w; } else { msgs = w; pendW = null; } tab = ''; draw(); side(); welcomeFx(m.room); }
  else if (m.t === 'left') { room = ''; curRW = ''; users = []; msgs.push({ sys: 1, welcome: 1, text: 'خرجت من الغرفة. اختار غرفة من «الغرف» عشان تكمل' }); tab = ''; draw(); side(); }
  else if (m.t === 'rooms') { rooms = m.list; side(); }
  else if (m.t === 'users') { users = m.list; users.forEach(u => names[u.id] = u.dn || u.name); side(); }
  else if (m.t === 'msg') { if (blocked.has(m.id)) return; msgs.push({ ...m, ts: Date.now() }); draw(); if (m.id !== me.id) { if (hasMention(m.text)) notify('mention', 'إشارة من ' + (m.dn || m.name), m.text); else notify('msg', m.dn || m.name, m.text || 'مرفق'); } }
  else if (m.t === 'sys') { if (m.ev) { msgs.push({ ...m, sys: 1, ts: Date.now() }); draw(); } else sys(m.text); }
  else if (m.t === 'delmsg') { msgs = msgs.filter(x => x.mid !== m.mid); draw(); }
  else if (m.t === 'ignores') { IGN = m.list || []; if (tab === 'settings') side(); }
  else if (m.t === 'repnew') { REPN = m.n || 0; toast('\u26A0 بلاغ جديد من ' + m.from + ' ضد ' + m.target); if (tab === 'cp') side(); }
  else if (m.t === 'fakes') { FAKES = m; if (tab === 'cp') side(); }
  else if (m.t === 'reports') { REPS = m; REPN = m.open || 0; if (tab === 'cp') side(); }
  else if (m.t === 'inbox') {
    (m.list || []).forEach(r => { const k = 'u' + r.uid; pmSetMeta(k, r.sid, r.uid, r.dn || r.name); inb[k] = { text: r.text, ts: r.ts, mine: r.mine, av: r.av }; unread[k] = r.unread || 0; });
    if (tab === 'chats' || tab === '') side();
  }
  else if (m.t === 'pmthread') {
    const k = 'u' + m.uid; pmSetMeta(k, m.sid, m.uid, m.dn || m.name); pms[k] = (m.list || []).map(x => ({ ...x })); unread[k] = 0;
    if (pmw === k) drawPm();
  }
  else if (m.t === 'pm') {
    const mine = m.from === me.id, k = mine ? pkey(m.to, m.toUid) : pkey(m.from, m.fromUid);
    if (!mine && (blocked.has(m.from) || nopm)) return;
    pmSetMeta(k, mine ? m.to : m.from, mine ? m.toUid : m.fromUid, mine ? (m.toDn || m.toName) : (m.fromDn || m.fromName));
    (pms[k] ||= []).push({ ...m, mine, ts: Date.now() }); inb[k] = { text: m.text || 'مرفق', ts: Date.now(), mine };
    if (!mine) notify('pm', 'رسالة خاصة من ' + (m.fromDn || m.fromName), m.text || 'مرفق');
    if (pmw === k) { unread[k] = 0; drawPm(); if (!mine && pmeta[k].uid) send({ t: 'pmthread', uid: pmeta[k].uid }); }
    else if (pmw === null && !mine) { pmw = k; unread[k] = 0; drawPm(); side(); }
    else if (!mine) { unread[k] = (unread[k] || 0) + 1; side(); }
  }
}

function applySite(m) {
  SITE = m; RULES = m.rules;
  $('.tk').textContent = m.welcome; $('.lh span').textContent = m.name + ' | شات عربي للجوال';
  $('.bn').style.cssText = m.banner && FILE_RE.test(m.banner) ? `background-image:linear-gradient(#0003,#0006),url("${U(m.banner)}");background-size:cover;background-position:center` : '';
  let st = document.getElementById('acs'); if (!st) { st = document.createElement('style'); st.id = 'acs'; document.head.append(st); }
  { const tp = document.querySelector('.top'); if (tp) tp.hidden = !m.roomsBar; }
  const a = /^#[0-9a-f]{6}$/i.test(m.accent) ? m.accent : '';
  st.textContent = a ? `.strip button.on,.tabs3 button.on,#nav button.on{border-color:${a};color:${a}}#pw,.ntc{border-color:${a}}` : '';
  const tb = document.querySelectorAll('.tabs3 button'); tb[1].style.opacity = 1; tb[0].style.opacity = m.guestOpen ? 1 : .5; tb[2].style.opacity = m.regOpen ? 1 : .5;
  if (document.getElementById('ep')) buildEmoji();
  if (typeof me !== 'undefined' && me && tab === 'cp') side();
}
function buildEmoji() {
  const ep = $('#ep'); ep.textContent = '';
  if (!(SITE.emojis || []).length) ep.append(el('div', 'nt', 'مفيش إيموجي لسه. المالك بيرفعها من الضبط ← لوحة التحكم ← البنرات والإيموجي.'));
  (SITE.emojis || []).forEach(x => { const b = btn('', () => { $('#t').value += x.name + ' '; $('#t').focus(); }), i = el('img', 'ce'); i.src = U(x.url); i.alt = x.name; i.title = x.name; i.style.height = '28px'; b.append(i); ep.append(b); });
}
const hasMention = t => !!t && !!me && t.toLowerCase().includes('@' + me.name.toLowerCase());
function toast(text) { const t = $('#toast'); t.textContent = text; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 4000); }
function notify(kind, title, body) {
  if (!NS[kind] || !me) return;
  if (kind === 'msg' && !document.hidden) return;
  if (!NS.mutesound) beep(kind === 'mention' ? 880 : kind === 'pm' ? 660 : 520);
  if (document.hidden) {
    unreadN++; document.title = `(${unreadN}) ${SITE.name || 'مسك'}`;
    if (NS.desk && 'Notification' in window && Notification.permission === 'granted') { try { new Notification(title, { body: String(body).slice(0, 100) }); } catch {} }
  } else if (kind === 'mention') toast(title + ': ' + body);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { unreadN = 0; document.title = SITE.name || 'مسك'; } });
const nd = s => s.replace(/[\u0660-\u0669]/g, c => c.charCodeAt(0) - 1632).replace(/[\u06f0-\u06f9]/g, c => c.charCodeAt(0) - 1776);
function rich(text) {
  const f = document.createDocumentFragment(), em = new Map((SITE.emojis || []).map(e => [e.name, e.url]));
  const re = new RegExp('(@' + me.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '|@[^\\s@:]{2,20}|:[\\p{L}\\p{N}_]{1,16}:)', 'giu');
  String(text).split(re).forEach((p, i) => {
    if (i % 2 === 0) { if (p) p.split(/(\s+)/).forEach(w => { const u = w.trim() && em.get(nd(w)); if (u) { const im = el('img', 'ce'); im.src = U(u); im.alt = w; f.append(im); } else if (w) f.append(w); }); return; }
    if (p[0] === '@') f.append(el('span', 'mn', p));
    else { const u = em.get(p.slice(1, -1)); if (u) { const im = el('img', 'ce'); im.src = U(u); im.alt = p; f.append(im); } else f.append(p); }
  });
  return f;
}
const FILE_RE = /^\/u\/[a-f0-9]{24}\.[a-z0-9]{2,4}$/;
const sz = n => n > 1e6 ? (n / 1e6).toFixed(1) + ' م.ب' : Math.max(1, Math.round(n / 1e3)) + ' ك.ب';
function attEl(f) {
  if (!f || !FILE_RE.test(f.url || '')) return null;
  if (f.kind === 'image') { const i = el('img', 'att'); i.src = U(f.url); i.loading = 'lazy'; i.alt = f.name || ''; i.onclick = e => { e.stopPropagation(); window.open(U(f.url), '_blank'); }; return i; }
  if (f.kind === 'audio' || f.kind === 'video') { const a = el(f.kind); a.controls = true; a.preload = 'none'; a.src = U(f.url); a.onclick = e => e.stopPropagation(); return a; }
  const a = el('a', 'fl', '\u{1F4CE} ' + (f.name || 'ملف') + ' (' + sz(f.size || 0) + ')'); a.href = U(f.url); a.download = f.name || ''; a.onclick = e => e.stopPropagation(); return a;
}
async function upl(file, kind) {
  try {
